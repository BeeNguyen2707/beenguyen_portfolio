<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Projects – Bee Hive</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      background-color: #1a1a1a; 
      color: #e0e0e0; 
      font-family: 'Inter', sans-serif; 
      line-height: 1.6; 
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 50px;
      padding: 30px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    nav a {
      color: #888;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transition: color 0.3s;
    }

    nav a:hover { color: #fff; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 100px 40px;
    }

    h1 {
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: #fff;
      margin-bottom: 80px;
      letter-spacing: -0.02em;
    }

    /* Project Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 60px;
    }

    .project-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      border: 1px solid #333;
    }

    .project-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border-color: #f0b429;
    }

    .image-container {
      width: 100%;
      height: 350px; /* Consistent height for the grid */
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      /* NO CROPPING: Ensures the entire design is visible */
      object-fit: contain; 
    }

    /* Centered Text Box */
    .project-info {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
    }

    .project-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    .project-date {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #f0b429; /* Highlighting the date */
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .project-grid { grid-template-columns: 1fr; }
      main { padding: 60px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Welcome</a>
    <a href="about.html">About me</a>
    <a href="projects.html">My projects</a>
  </nav>

  <main>
    <h1>Engineering Gallery</h1>

    <div class="project-grid">

      <!-- Concept Rescue Drone -->
      <a href="project-drone.html" class="project-card">
        <div class="image-container">
          <img src="images/drone-main.jpg" alt="Concept Rescue Drone">
        </div>
        <div class="project-info">
          <h2 class="project-name">Concept Rescue Drone</h2>
          <span class="project-date">Fall 2024</span>
        </div>
      </a>

      <!-- Thermal Electric Vehicle -->
      <a href="project-tev.html" class="project-card">
        <div class="image-container">
          <img src="images/tev-main.jpg" alt="Thermal Electric Vehicle">
        </div>
        <div class="project-info">
          <h2 class="project-name">Thermal Electric Vehicle</h2>
          <span class="project-date">Winter 2024</span>
        </div>
      </a>

      <!-- The Peregrine -->
      <a href="project-peregrine.html" class="project-card">
        <div class="image-container">
          <img src="images/peregrine-main.jpg" alt="The Peregrine Aircraft">
        </div>
        <div class="project-info">
          <h2 class="project-name">The Peregrine</h2>
          <span class="project-date">Design Phase</span>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
