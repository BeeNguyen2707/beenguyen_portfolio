<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to the Bee Hive</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Dancing+Script:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #0a1628;
      background-image: 
        url('images/bee-logo.jpg'), 
        linear-gradient(135deg, #0d1f3c 0%, #0a1628 40%, #0d2444 70%, #0a1628 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5); /* 50% Darker overlay */
      z-index: 0;
      pointer-events: none;
    }

    .hero {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 10vw, 5rem);
      margin-bottom: 60px;
      line-height: 1.2;
    }

    .title .welcome { color: #5bc8f5; }
    .title .to-the  { color: #ffffff; }
    .title .bee-hive { color: #f0b429; }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 50px;
    }

    .nav-buttons a {
      background: #fff;
      color: #111;
      text-decoration: none;
      padding: 16px 45px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .nav-buttons a:hover {
      background: #f0b429;
      transform: translateY(-5px);
    }

    .contact { color: #aaa; font-size: 0.9rem; }
    .contact a { color: #f0b429; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <h1 class="title">
      <span class="welcome">Welcome</span>
      <span class="to-the"> to the </span><br>
      <span class="bee-hive">Bee Hive</span>
    </h1>

    <div class="nav-buttons">
      <a href="about.html">About me</a>
      <a href="projects.html">My projects</a>
    </div>

    <p class="contact">Contact: <a href="mailto:hoanganhhp2003@gmail.com">hoanganhhp2003@gmail.com</a></p>
  </div>
</body>
</html>
