<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to the Bee Hive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

   body {
      min-height: 100vh;
      background-color: #0a1628;
      
      /* 1. Change .png to .jpg here */
      background-image: 
        url('images/bee-logo.jpg'), 
        linear-gradient(135deg, #0d1f3c 0%, #0a1628 40%, #0d2444 70%, #0a1628 100%);
      
      /* 2. Use 'cover' for both if the bee-logo is a full-page image */
      background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow-y: auto; 
    }

    /* Subtle overlay to keep text readable against the background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 40, 0.4); /* Adds a 40% dark tint */
      z-index: 0;
      pointer-events: none;
    }

    .hero {
      position: relative;
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      margin-bottom: 40px;
      line-height: 1.2;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    .title .welcome { color: #5bc8f5; }
    .title .to-the  { color: #ffffff; }
    .title .bee-hive { color: #f0b429; }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
    }

    .nav-buttons a {
      background: rgba(255,255,255,0.92);
      color: #111;
      text-decoration: none;
      padding: 12px 35px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .nav-buttons a:hover {
      background: #fff;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .email {
      color: #ccc;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .email a {
      color: #f0b429;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }

    .email a:hover {
      border-color: #f0b429;
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- The logo is now part of the background CSS above -->
    
    <h1 class="title">
      <span class="welcome">Welcome</span>
      <span class="to-the"> to the </span>
      <br> <!-- Added for better mobile stacking -->
      <span class="bee-hive">Bee Hive</span>
    </h1>

    <div class="nav-buttons">
      <a href="about.html">About me</a>
      <a href="projects.html">My projects</a>
    </div>

    <p class="email">
      Contact: <a href="mailto:hoanganhhp2003@gmail.com">hoanganhhp2003@gmail.com</a>
    </p>
  </div>
</body>
</html>
