<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Projects – Bee Hive</title>
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap)" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 18px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    nav a:hover { color: #fff; }
    nav a.active { color: #fff; font-weight: 400; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    h1.page-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 300;
      color: #fff;
      margin-bottom: 70px;
      letter-spacing: 0.04em;
    }

    /* Each project row: image left, text right (alternates) */
    .project-row {
      display: flex;
      align-items: center;
      margin-bottom: 60px;
      gap: 0;
      background: #222;
      min-height: 340px;
    }

    .project-row.reverse { flex-direction: row-reverse; }

    .project-row .thumb {
      flex: 0 0 62%;
      max-width: 62%;
    }

    .project-row .thumb img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      display: block;
    }

    .project-row .info {
      flex: 1;
      padding: 32px 36px;
      text-align: center;
    }

    .project-row .info h2 {
      font-size: 1.05rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 8px;
    }

    .project-row .info .date {
      font-size: 0.78rem;
      color: #888;
    }

    .project-row a {
      text-decoration: none;
      color: inherit;
      display: flex;
      width: 100%;
    }

    .project-row:hover .thumb img {
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    @media (max-width: 700px) {
      .project-row, .project-row.reverse { flex-direction: column; }
      .project-row .thumb { max-width: 100%; flex: none; }
      .project-row .thumb img { height: 220px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Welcome</a>
    <a href="about.html">About me</a>
    <a href="projects.html" class="active">My projects</a>
  </nav>

  <main>
    <h1 class="page-title">Check out my stuffs!</h1>

    <!-- Project 1: Thermal Electric Vehicle -->
    <div class="project-row">
      <a href="project-tev.html">
        <div class="thumb">
          <img src="images/tev-main.jpg" alt="Thermal Electric Vehicle" />
        </div>
        <div class="info">
          <h2>Thermal Electric Vehicle</h2>
          <p class="date">April, 2025</p>
        </div>
      </a>
    </div>

    <!-- Project 2: Concept Rescue Drone (reversed layout) -->
    <div class="project-row reverse">
      <a href="project-drone.html">
        <div class="thumb">
          <img src="images/drone-main.jpg" alt="Concept Rescue Drone" />
        </div>
        <div class="info">
          <h2>Concept Rescue Drone</h2>
          <p class="date">November, 2024</p>
        </div>
      </a>
    </div>

    <!-- Project 3: The Peregrine -->
    <div class="project-row">
      <a href="project-peregrine.html">
        <div class="thumb">
          <img src="images/peregrine-main.jpg" alt="The Peregrine" />
        </div>
        <div class="info">
          <h2>The Peregrine</h2>
          <p class="date">April, 2024</p>
        </div>
      </a>
    </div>

  </main>
</body>
</html>
