<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Concept Rescue Drone – Bee Hive</title>
  <!-- Added Montserrat for a bold, technical heading look -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1.1rem; /* Increased base font size */
      line-height: 1.8;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 24px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.3s;
    }

    nav a:hover { color: #fff; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    h1.page-title {
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem); /* Significantly bigger and responsive */
      font-weight: 700;
      color: #fff;
      margin-bottom: 80px;
      letter-spacing: -0.02em;
    }

    .block { display: flex; align-items: center; margin-bottom: 120px; gap: 60px; }
    .block.reverse { flex-direction: row-reverse; }

    .block img {
      width: 50%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .block .text {
      width: 50%;
      padding: 0 20px;
    }

    .block .text p {
      margin-bottom: 24px;
      color: #ccc;
      font-size: 1.2rem; /* Enhanced readability */
    }

    .block.full { margin-bottom: 100px; }
    .block.full img { width: 100%; max-height: 85vh; object-fit: contain; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

    .also-like { margin-top: 120px; border-top: 1px solid #333; padding-top: 60px; }
    .also-like h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 40px;
      color: #888;
    }

    .also-grid { display: flex; gap: 24px; }
    .also-grid a { flex: 1; text-decoration: none; }
    .also-grid img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; transition: transform 0.3s; }
    .also-grid a:hover img { transform: translateY(-10px); }

    @media (max-width: 900px) {
      .block, .block.reverse { flex-direction: column; text-align: center; }
      .block img, .block .text { width: 100%; }
      .also-grid { flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Welcome</a>
    <a href="about.html">About me</a>
    <a href="projects.html">My projects</a>
  </nav>

  <main>
    <h1 class="page-title">Concept Rescue Drone</h1>

    <div class="block">
      <img src="images/drone-perspective.jpg" alt="Drone view" />
      <div class="text">
        <p>A specialized octo-rotor design developed for the Fall 2024 Mechanical Drawing course.</p>
        <p>The system integrates dual camera modules—providing both standard optical and thermal imaging—alongside four environmental sensors.</p>
      </div>
    </div>

    <!-- Additional images from the gallery -->
    <div class="block full"><img src="images/drone-front.jpg" alt="Front view" /></div>
    <div class="block full"><img src="images/drone-top.jpg" alt="Top view" /></div>

    <div class="also-like">
      <h2>My other projects</h2>
      <div class="also-grid">
        <a href="project-peregrine.html"><img src="images/peregrine-main.jpg" alt="Peregrine" /></a>
        <a href="project-tev.html"><img src="images/tev-main.jpg" alt="TEV" /></a>
      </div>
    </div>
  </main>
</body>
</html>
